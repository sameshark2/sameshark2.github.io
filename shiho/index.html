<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="しほんぬ">
<meta name="theme-color" content="#ffd6e8">
<title>しほんぬタッピング！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#ffe1ef; --bg2:#ffd0a8; --pink:#ff5c9d; --font:"Mochiy Pop One","Hiragino Maru Gothic ProN","Rounded Mplus 1c",sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html,body { margin:0; height:100%; overflow:hidden; touch-action:none; overscroll-behavior:none; font-family:var(--font); color:#5a3d5c; }
  body { background:
      radial-gradient(circle, rgba(255,255,255,.55) 7px, transparent 8px) 0 0 / 44px 44px,
      linear-gradient(160deg, var(--bg1), var(--bg2)); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }

  /* ---- タイトル画面 ---- */
  #title { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px; padding:24px; text-align:center; transition:opacity .4s, transform .4s; }
  #title.hide { opacity:0; transform:scale(1.2); pointer-events:none; }
  .logo { font-size:clamp(34px, 11vw, 64px); line-height:1.25; margin:0; }
  .logo span { display:inline-block; color:#fff; animation:hop 1.2s ease-in-out infinite;
    -webkit-text-stroke:0; text-shadow: 0 4px 0 var(--c), 3px 3px 0 var(--c), -3px 3px 0 var(--c), 3px -3px 0 var(--c), -3px -3px 0 var(--c), 0 10px 18px rgba(0,0,0,.15); }
  @keyframes hop { 0%,100% { transform:translateY(0) } 30% { transform:translateY(-14px) rotate(-6deg) } 60% { transform:translateY(0) rotate(4deg) } }
  .for { font-size:18px; background:#fff; color:var(--pink); padding:8px 18px; border-radius:999px; box-shadow:0 4px 0 #ffb3cf; }
  #play { font-family:var(--font); font-size:34px; color:#fff; background:linear-gradient(#ff7eb3,#ff4f93); border:none; border-radius:999px;
    padding:18px 64px; box-shadow:0 8px 0 #d6336f, 0 14px 24px rgba(214,51,111,.35); cursor:pointer; animation:pulse 1.4s ease-in-out infinite; }
  #play:active { transform:translateY(6px); box-shadow:0 2px 0 #d6336f; }
  @keyframes pulse { 50% { transform:scale(1.07) } }
  .deco { position:absolute; font-size:44px; animation:float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-16px) rotate(8deg) } }

  /* ---- ゲーム中の表示 ---- */
  #hud { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px; z-index:5; display:none; justify-content:space-between; pointer-events:none; }
  #hud.on { display:flex; }
  .pill { background:#fff; border-radius:999px; padding:8px 18px; font-size:24px; box-shadow:0 5px 0 rgba(0,0,0,.1); }
  #score { color:#ff9f1a; } #lv { color:#4aa8ff; }
  .bump { animation:bump .25s; } @keyframes bump { 50% { transform:scale(1.25) } }
  #banner { position:fixed; left:0; right:0; top:34%; z-index:6; text-align:center; font-size:clamp(40px, 13vw, 80px); color:#fff; pointer-events:none;
    text-shadow:0 5px 0 var(--pink), 4px 4px 0 var(--pink), -4px 4px 0 var(--pink), 4px -4px 0 var(--pink), -4px -4px 0 var(--pink); opacity:0; }
  #banner.on { animation:banner 1.8s ease-out; }
  @keyframes banner { 0% { opacity:0; transform:scale(.2) rotate(-20deg) } 15% { opacity:1; transform:scale(1.2) rotate(4deg) } 25% { transform:scale(1) rotate(0) } 80% { opacity:1 } 100% { opacity:0; transform:translateY(-40px) } }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:4; transition:opacity .5s; }

  /* ---- おとなメニュー ---- */
  #gear { position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom)); z-index:7; width:52px; height:52px; border-radius:50%;
    background:rgba(255,255,255,.55); display:none; align-items:center; justify-content:center; font-size:24px; }
  #gear.on { display:flex; }
  #gear svg { position:absolute; inset:0; transform:rotate(-90deg); }
  #gear circle { fill:none; stroke:var(--pink); stroke-width:4; stroke-dasharray:151; stroke-dashoffset:151; }
  #gear.hold circle { transition:stroke-dashoffset 1.2s linear; stroke-dashoffset:0; }
  #menu { position:fixed; inset:0; z-index:20; background:rgba(90,61,92,.45); display:none; align-items:center; justify-content:center; padding:16px; }
  #menu.on { display:flex; }
  .card { background:#fff; border-radius:28px; padding:22px; width:100%; max-width:360px; text-align:center; box-shadow:0 8px 0 #ffb3cf; font-family:-apple-system,"Hiragino Sans",sans-serif; }
  .card h2 { font-family:var(--font); margin:0 0 6px; color:var(--pink); font-weight:normal; }
  .card p { font-size:13px; color:#8a748c; margin:6px 0 14px; line-height:1.6; }
  .card button { font-family:var(--font); font-size:17px; width:100%; margin:6px 0; padding:13px; border:none; border-radius:16px; color:#fff; cursor:pointer; }
  .b-rec { background:#ff5c9d; } .b-rec.rec { background:#e0245e; animation:pulse .6s infinite; }
  .b-try { background:#4aa8ff; } .b-del { background:#b9a6bb; } .b-bgm { background:#5fc98a; } .b-close { background:#5a3d5c; }
  .row { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:15px; }
  .row input { flex:1; accent-color:#ff5c9d; }
  #vstate { font-size:14px; color:#5a3d5c; margin:4px 0 8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="title">
  <div class="deco" style="top:9%;left:8%">🐰</div>
  <div class="deco" style="top:13%;right:9%;animation-delay:.6s">🍓</div>
  <div class="deco" style="bottom:14%;left:10%;animation-delay:1.1s">🐥</div>
  <div class="deco" style="bottom:10%;right:12%;animation-delay:.3s">🐻</div>
  <h1 class="logo" id="logo"></h1>
  <div class="for">💕 しほちゃん せんよう 💕</div>
  <button id="play">あそぶ！</button>
</div>

<div id="hud"><div class="pill" id="score">⭐ 0</div><div class="pill" id="lv">Lv.1</div></div>
<div id="banner"></div>
<div id="gear" title="おとなの人は長押し"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/></svg>⚙️</div>

<div id="menu">
  <div class="card">
    <h2>おとなメニュー</h2>
    <p>「あたっ！」の声を録音できます。<br>ボタンを押したら すぐに「あたっ！」と言ってね。</p>
    <div id="vstate">いまの声：よみあげ</div>
    <button class="b-rec" id="rec">🎙️ 録音する（2びょう）</button>
    <button class="b-try" id="try">▶️ きいてみる</button>
    <button class="b-del" id="del">🗑️ 録音を消す</button>
    <button class="b-bgm" id="bgm">🎵 BGM：オン</button>
    <div class="row">🔈<input type="range" id="vol" min="0" max="1" step="0.05" value="0.8">🔊</div>
    <p>録音した声は この端末の中だけに保存されます。</p>
    <button class="b-close" id="close">✕ とじる</button>
  </div>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const FONT = '"Mochiy Pop One","Hiragino Maru Gothic ProN",sans-serif';
  const COLORS = ['#ff5c9d', '#ff9f1a', '#ffd21f', '#4cc97f', '#3fb4ff', '#a37bff', '#ff7a59'];
  const THEMES = [['#ffe1ef', '#ffd0a8'], ['#d9f4ff', '#e8dcff'], ['#e0ffd9', '#fff6b8'], ['#ffe6f7', '#c9f1ff'], ['#fff0c2', '#ffc9de'], ['#e8e0ff', '#ffe0f0']];
  const ANIMALS = ['🐶', '🐱', '🐰', '🐻', '🐼', '🐥', '🐸', '🦄', '🐷', '🐨', '🐹', '🦁', '🐧', '🐳', '🍓', '🍰', '🍭', '🌈'];
  const PRAISE = ['すごーい！', 'じょうず！', 'やったね！', 'てんさい！', 'しほちゃん さいこう！', 'ばんざーい！'];
  const rnd = (a, b) => a + Math.random() * (b - a), pick = a => a[(Math.random() * a.length) | 0];
  const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (_) { return false; } }, del(k) { try { localStorage.removeItem(k); } catch (_) {} } };

  // タイトル文字を1文字ずつ色付きで跳ねさせる
  [...'しほんぬタッピング！'].forEach((ch, i) => {
    const s = document.createElement('span'); s.textContent = ch;
    s.style.setProperty('--c', COLORS[i % COLORS.length]); s.style.animationDelay = (i * .09) + 's';
    $('#logo').appendChild(s); if (i === 3) $('#logo').appendChild(document.createElement('br'));
  });

  // ---- キャンバス ----
  const cv = $('#c'), ctx = cv.getContext('2d'); let W, H, DPR;
  function resize() { DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
  addEventListener('resize', resize); resize();
  const ecache = new Map();
  function emo(ch) {
    if (ecache.has(ch)) return ecache.get(ch);
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d'); x.font = '96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, 64, 72); ecache.set(ch, c); return c;
  }

  // ================= 音 =================
  let AC = null, master, bgmGain, sfxGain, bgmOn = store.get('shiho-bgm') !== 'off', vol = +(store.get('shiho-vol') || .8), voiceBuf = null;
  function initAudio() {
    if (AC) return;
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = vol; master.connect(AC.destination);
    sfxGain = AC.createGain(); sfxGain.connect(master);
    bgmGain = AC.createGain(); bgmGain.gain.value = bgmOn ? .22 : 0; bgmGain.connect(master);
    loadVoice(); bgmT = AC.currentTime + .4; setInterval(bgmTick, 60);
  }
  function tone(f, t, o = {}) {
    const { type = 'sine', dur = .3, v = .3, to = null, dest = sfxGain } = o;
    const osc = AC.createOscillator(), g = AC.createGain();
    osc.type = type; osc.frequency.setValueAtTime(f, t); if (to) osc.frequency.exponentialRampToValueAtTime(to, t + dur * .7);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    osc.connect(g); g.connect(dest); osc.start(t); osc.stop(t + dur + .05);
  }
  const PENTA = [523, 587, 659, 784, 880, 1047, 1175, 1319];
  const sfxPop = () => { const t = AC.currentTime, f = rnd(500, 800); tone(f, t, { dur: .16, v: .35, to: f * 2.2 }); };
  const sfxBubble = () => { const t = AC.currentTime; [0, 2, 4, 7].forEach((k, i) => tone(PENTA[k % 8] * (k > 6 ? 1 : 1), t + i * .06, { type: 'triangle', dur: .3, v: .22 })); };
  const sfxFanfare = () => { const t = AC.currentTime; [[523, 0], [659, .12], [784, .24], [1047, .4], [784, .55], [1047, .7]].forEach(([f, d]) => { tone(f, t + d, { type: 'square', dur: .25, v: .08 }); tone(f, t + d, { type: 'triangle', dur: .4, v: .18 }); }); };

  // BGM：きらきら星（オルゴール風）
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9 };
  const MEL = 'C C G G A A G- F F E E D D C- G G F F E E D- G G F F E E D- C C G G A A G- F F E E D D C-'.split(' ')
    .map(n => ({ f: 523.25 * Math.pow(2, NOTE[n[0]] / 12), b: n.endsWith('-') ? 2 : 1 }));
  const ROOTS = 'C C F C F C G C C F C G C F C G C C F C F C G C'.split(' ').map(n => 130.81 * Math.pow(2, NOTE[n] / 12));
  const BEAT = .42; let bgmT = 0, mi = 0, beat = 0;
  function bgmTick() {
    if (AC.state !== 'running') { bgmT = AC.currentTime + .2; return; }
    while (bgmT < AC.currentTime + .3) {
      const m = MEL[mi];
      tone(m.f, bgmT, { dur: 1.2, v: .5, dest: bgmGain }); tone(m.f * 2, bgmT, { dur: .5, v: .12, dest: bgmGain });
      for (let k = 0; k < m.b; k++) { if ((beat + k) % 2 === 0) { const r = ROOTS[((beat + k) / 2) % ROOTS.length]; tone(r, bgmT + k * BEAT, { type: 'triangle', dur: .9, v: .35, dest: bgmGain }); } }
      bgmT += m.b * BEAT; beat += m.b; mi++;
      if (mi === MEL.length) { mi = 0; beat = 0; bgmT += BEAT * 2; }
    }
  }

  // 「あたっ！」の声：録音があればそれを、なければ読み上げ
  let jaVoice = null;
  function findVoice() { const v = speechSynthesis.getVoices().filter(v => /ja/i.test(v.lang)); jaVoice = v.find(v => /Kyoko|O-ren|Nanami|Haruka/i.test(v.name)) || v[0] || null; }
  if ('speechSynthesis' in window) { findVoice(); speechSynthesis.onvoiceschanged = findVoice; }
  function speak(text, pitch = 1.8) {
    if (!('speechSynthesis' in window)) return;
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice;
    u.pitch = pitch; u.rate = 1.15; u.volume = Math.min(1, vol * 1.2); speechSynthesis.speak(u);
  }
  let lastAta = 0;
  function sayAta() {
    const now = performance.now(); if (now - lastAta < 280) return; lastAta = now;
    if (voiceBuf) { const s = AC.createBufferSource(); s.buffer = voiceBuf; s.playbackRate.value = rnd(.95, 1.2); const g = AC.createGain(); g.gain.value = 1.6; s.connect(g); g.connect(master); s.start(); }
    else speak('あたっ！', rnd(1.6, 2));
  }
  function trim(buf) {
    const d = buf.getChannelData(0); let a = 0, b = d.length - 1; const th = .025;
    while (a < d.length && Math.abs(d[a]) < th) a++; while (b > a && Math.abs(d[b]) < th) b--;
    a = Math.max(0, a - 400); b = Math.min(d.length, b + 2400);
    if (b - a < 800) return buf;
    const out = AC.createBuffer(1, b - a, buf.sampleRate); out.getChannelData(0).set(d.subarray(a, b)); return out;
  }
  async function loadVoice() {
    const url = store.get('shiho-voice'); if (!url || !AC) { voiceBuf = null; updVstate(); return; }
    try { const ab = await (await fetch(url)).arrayBuffer(); voiceBuf = trim(await AC.decodeAudioData(ab)); } catch (_) { voiceBuf = null; }
    updVstate();
  }
  function updVstate() { $('#vstate').textContent = 'いまの声：' + (voiceBuf ? '🎙️ 録音した声' : '🗣️ よみあげ'); }

  // ================= ゲーム =================
  let playing = false, score = 0, level = 1, shake = 0, lastTap = performance.now();
  const floaters = [], parts = [], texts = [], confetti = [];
  const PER_LEVEL = 20;

  function spawnFloater() {
    const r = rnd(42, 58);
    floaters.push({ x: rnd(r, W - r), y: H + r + 10, r, vy: rnd(.6, 1.2), ph: rnd(0, 6), ch: pick(ANIMALS), col: pick(COLORS), pop: 0 });
  }
  function burst(x, y, n, big) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), s = rnd(2, big ? 11 : 7);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, col: pick(COLORS), sz: rnd(6, big ? 16 : 12), shape: pick(['star', 'heart', 'dot']), rot: rnd(0, 6) });
    }
  }
  function tap(x, y) {
    lastTap = performance.now();
    if (texts.length > 10) texts.shift();
    texts.push({ x, y, t: 0, rot: rnd(-.3, .3), col: pick(COLORS), s: rnd(.9, 1.15) });
    burst(x, y, 14);
    sfxPop(); sayAta();
    if (navigator.vibrate) navigator.vibrate(15);
    let add = 1;
    const hit = floaters.find(f => !f.pop && Math.hypot(f.x - x, f.y - y) < f.r + 20);
    if (hit) { hit.pop = 1; add = 3; burst(hit.x, hit.y, 26, true); sfxBubble(); shake = 10; for (let i = 0; i < 4; i++) parts.push({ x: hit.x, y: hit.y, vx: rnd(-5, 5), vy: rnd(-9, -4), life: 1, sz: 34, emo: hit.ch, rot: 0 }); }
    else shake = Math.max(shake, 4);
    score += add;
    const el = $('#score'); el.textContent = '⭐ ' + score; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    if (Math.floor(score / PER_LEVEL) + 1 > level) levelUp();
  }
  function levelUp() {
    level++;
    $('#lv').textContent = 'Lv.' + level;
    const th = THEMES[(level - 1) % THEMES.length];
    document.documentElement.style.setProperty('--bg1', th[0]); document.documentElement.style.setProperty('--bg2', th[1]);
    const msg = PRAISE[(level - 2) % PRAISE.length];
    const b = $('#banner'); b.textContent = msg; b.classList.remove('on'); void b.offsetWidth; b.classList.add('on');
    $('#flash').style.opacity = .7; setTimeout(() => $('#flash').style.opacity = 0, 120);
    sfxFanfare(); setTimeout(() => speak(msg, 1.6), 500);
    for (let i = 0; i < 140; i++) confetti.push({ x: rnd(0, W), y: rnd(-H * .6, -10), vx: rnd(-1, 1), vy: rnd(2, 5), rot: rnd(0, 6), vr: rnd(-.2, .2), w: rnd(8, 14), h: rnd(5, 9), col: pick(COLORS) });
    if (navigator.vibrate) navigator.vibrate([30, 40, 30, 40, 60]);
  }

  // ---- 描画 ----
  function star(x, y, r, n = 5, inner = .45) { ctx.beginPath(); for (let i = 0; i < n * 2; i++) { const a = i * Math.PI / n - Math.PI / 2, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); }
  function heart(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s * .35); ctx.bezierCurveTo(x - s, y - s * .3, x - s * .45, y - s, x, y - s * .45); ctx.bezierCurveTo(x + s * .45, y - s, x + s, y - s * .3, x, y + s * .35); ctx.closePath(); }
  const easeBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  let lastSpawn = 0;
  function frame(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
    if (shake > .3) { ctx.translate(rnd(-shake, shake), rnd(-shake, shake)); shake *= .85; }

    if (playing) {
      if (now - lastSpawn > 1500 && floaters.length < 5) { spawnFloater(); lastSpawn = now; }
      // しばらく触らないと「タップしてね」
      if (now - lastTap > 5000) {
        const k = (now / 500) % 2, s = 1 + Math.sin(now / 200) * .08;
        ctx.save(); ctx.globalAlpha = .9; ctx.drawImage(emo('👆'), W / 2 - 40 * s, H * .55 - 30 + (k < 1 ? -10 : 0), 80 * s, 80 * s);
        ctx.font = `26px ${FONT}`; ctx.textAlign = 'center'; ctx.lineWidth = 7; ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#ff5c9d';
        ctx.strokeText('タップしてね！', W / 2, H * .55 + 90); ctx.fillText('タップしてね！', W / 2, H * .55 + 90); ctx.restore();
      }
    }

    // ふわふわ浮かぶ どうぶつ風船
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      if (f.pop) { f.pop += .12; if (f.pop > 2) { floaters.splice(i, 1); continue; } }
      f.y -= f.vy; f.ph += .03; const x = f.x + Math.sin(f.ph) * 14;
      if (f.y < -f.r - 20) { floaters.splice(i, 1); continue; }
      const sc = f.pop ? 1 + (f.pop - 1) * .6 : 1 + Math.sin(f.ph * 2) * .04;
      ctx.save(); ctx.globalAlpha = f.pop ? Math.max(0, 2 - f.pop) : 1; ctx.translate(x, f.y); ctx.scale(sc, sc);
      ctx.beginPath(); ctx.arc(0, 0, f.r, 0, Math.PI * 2); ctx.fillStyle = f.col + '55'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#ffffffcc'; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-f.r * .4, -f.r * .45, f.r * .22, f.r * .12, -.6, 0, Math.PI * 2); ctx.fillStyle = '#ffffffaa'; ctx.fill();
      ctx.drawImage(emo(f.ch), -f.r * .8, -f.r * .8, f.r * 1.6, f.r * 1.6);
      ctx.restore(); f.dx = x;
    }

    // キラキラ
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.vy += .25; p.vx *= .98; p.x += p.vx; p.y += p.vy; p.life -= .022; p.rot += .1;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life * 1.6); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.emo) ctx.drawImage(emo(p.emo), -p.sz / 2, -p.sz / 2, p.sz, p.sz);
      else { ctx.fillStyle = p.col; if (p.shape === 'star') star(0, 0, p.sz); else if (p.shape === 'heart') heart(0, 0, p.sz); else { ctx.beginPath(); ctx.arc(0, 0, p.sz * .5, 0, 7); } ctx.fill(); }
      ctx.restore();
    }

    // 「あたっ！」の文字
    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i]; t.t += 1 / 55; if (t.t >= 1) { texts.splice(i, 1); continue; }
      const sIn = t.t < .25 ? easeBack(t.t / .25) : 1, s = (.3 + .7 * sIn) * t.s, a = t.t > .7 ? 1 - (t.t - .7) / .3 : 1;
      ctx.save(); ctx.globalAlpha = a; ctx.translate(t.x, t.y - t.t * 50 - 50); ctx.rotate(t.rot); ctx.scale(s, s);
      star(0, 0, 82, 12, .72); ctx.fillStyle = '#fff59a'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = t.col; ctx.stroke();
      ctx.font = `44px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      ctx.lineWidth = 12; ctx.strokeStyle = '#fff'; ctx.strokeText('あたっ！', 0, 2); ctx.fillStyle = t.col; ctx.fillText('あたっ！', 0, 2);
      ctx.restore();
    }

    // 紙ふぶき
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i]; c.x += c.vx + Math.sin(c.y / 30); c.y += c.vy; c.rot += c.vr;
      if (c.y > H + 20) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.scale(1, Math.cos(c.rot * 2)); ctx.fillStyle = c.col; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  cv.addEventListener('pointerdown', e => { if (playing) { e.preventDefault(); tap(e.clientX, e.clientY); } });
  addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  // ---- スタート ----
  let wake = null;
  async function keepAwake() { try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && playing) { keepAwake(); if (AC) AC.resume(); } });
  $('#play').addEventListener('click', () => {
    initAudio(); AC.resume();
    speak('あそぼう！', 1.7);
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (_) {}
    keepAwake();
    $('#title').classList.add('hide'); $('#hud').classList.add('on'); $('#gear').classList.add('on');
    playing = true; lastTap = performance.now();
    for (let i = 0; i < 3; i++) setTimeout(spawnFloater, i * 400);
  });

  // ---- おとなメニュー（長押しで開く） ----
  const gear = $('#gear'); let holdT = null;
  gear.addEventListener('pointerdown', e => { e.stopPropagation(); gear.classList.add('hold'); holdT = setTimeout(openMenu, 1200); });
  const cancelHold = () => { clearTimeout(holdT); gear.classList.remove('hold'); };
  gear.addEventListener('pointerup', cancelHold); gear.addEventListener('pointerleave', cancelHold); gear.addEventListener('pointercancel', cancelHold);
  function openMenu() { cancelHold(); playing = false; $('#menu').classList.add('on'); updVstate(); updBgm(); }
  $('#close').onclick = () => { $('#menu').classList.remove('on'); playing = true; lastTap = performance.now(); };
  function updBgm() { $('#bgm').textContent = '🎵 BGM：' + (bgmOn ? 'オン' : 'オフ'); }
  $('#bgm').onclick = () => { bgmOn = !bgmOn; store.set('shiho-bgm', bgmOn ? 'on' : 'off'); if (AC) bgmGain.gain.setTargetAtTime(bgmOn ? .22 : 0, AC.currentTime, .1); updBgm(); };
  $('#vol').value = vol;
  $('#vol').oninput = e => { vol = +e.target.value; store.set('shiho-vol', vol); if (AC) master.gain.setTargetAtTime(vol, AC.currentTime, .05); };
  $('#try').onclick = () => { lastAta = 0; sayAta(); };
  $('#del').onclick = () => { store.del('shiho-voice'); voiceBuf = null; updVstate(); };
  $('#rec').onclick = async () => {
    const btn = $('#rec');
    if (!navigator.mediaDevices || !window.MediaRecorder) { alert('このブラウザでは録音できません'); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true } }); }
    catch (_) { alert('マイクの許可が必要です'); return; }
    const chunks = [], mr = new MediaRecorder(stream);
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      btn.classList.remove('rec'); btn.textContent = '🎙️ 録音する（2びょう）';
      const blob = new Blob(chunks, { type: mr.mimeType || 'audio/mp4' }), fr = new FileReader();
      fr.onload = async () => {
        if (!store.set('shiho-voice', fr.result)) { alert('保存できませんでした（このページを閉じると消えます）'); }
        try { voiceBuf = trim(await AC.decodeAudioData(await blob.arrayBuffer())); } catch (_) { voiceBuf = null; alert('うまく録音できませんでした。もう一度ためしてね'); }
        updVstate(); if (voiceBuf) { lastAta = 0; sayAta(); }
      };
      fr.readAsDataURL(blob);
    };
    mr.start(); btn.classList.add('rec');
    let n = 2; btn.textContent = `🔴 いま録音中… ${n}`;
    const iv = setInterval(() => { n--; if (n > 0) btn.textContent = `🔴 いま録音中… ${n}`; else { clearInterval(iv); mr.stop(); } }, 1000);
  };
})();
</script>
