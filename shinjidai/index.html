<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>新時代 — スマホが筆になる</title>
<style>
  :root { --fg:#f2f4ff; --dim:rgba(242,244,255,.6); --glass:rgba(255,255,255,.08); --line:rgba(255,255,255,.18); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#05060a; color:var(--fg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; touch-action:none; overscroll-behavior:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #intro { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:24px; text-align:center; background:radial-gradient(circle at 50% 40%,#1a1440 0%,#05060a 70%); z-index:10; transition:opacity .6s; }
  #intro.hide { opacity:0; pointer-events:none; }
  h1 { margin:0; font-size:clamp(48px,16vw,96px); letter-spacing:.08em; font-weight:800;
    background:linear-gradient(90deg,#7cf,#c7f,#f8a,#fd6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #intro p { margin:0; max-width:340px; line-height:1.8; color:var(--dim); font-size:15px; }
  ul.how { list-style:none; padding:0; margin:0; text-align:left; font-size:14px; line-height:2; color:var(--fg); }
  button { font:inherit; color:var(--fg); background:var(--glass); border:1px solid var(--line); border-radius:999px;
    padding:12px 20px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); cursor:pointer; }
  #start { font-size:18px; padding:16px 44px; background:linear-gradient(90deg,#5b8cff,#b45bff); border:none; font-weight:700; }
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom)); z-index:5; }
  #hud { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:16px; right:16px; z-index:5; font-size:12px;
    font-variant-numeric:tabular-nums; color:var(--dim); display:none; line-height:1.6; pointer-events:none;
    background:rgba(0,0,0,.35); border-radius:12px; padding:8px 12px; }
  #hud.show { display:block; }
  #toast { position:fixed; top:40%; left:50%; transform:translate(-50%,-50%); font-size:28px; font-weight:800; letter-spacing:.1em;
    opacity:0; transition:opacity .4s; z-index:6; pointer-events:none; text-shadow:0 0 20px rgba(0,0,0,.6); }
  #toast.on { opacity:1; }
  #bar button { padding:10px 14px; font-size:14px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="e" style="pointer-events:none"></canvas>

<div id="intro">
  <h1>新時代</h1>
  <p>あなたのスマホのセンサーが、そのまま筆になる。<br>傾き・揺れ・指先・時間・場所から、今この瞬間だけの絵が生まれます。</p>
  <ul class="how">
    <li>📱 傾ける → 光が流れる方向が変わる</li>
    <li>👆 触る → 光と絵文字が湧き出す＆音が鳴る</li>
    <li>🫨 振る → 色の世界が切り替わる</li>
    <li>🕒 時刻と場所 → 最初の色が決まる</li>
    <li>🎹 バッハ「平均律 前奏曲 ハ長調」が流れる</li>
  </ul>
  <button id="start">はじめる</button>
  <p style="font-size:12px">センサーの許可を求められたら「許可」を押してください。<br>データは端末の中だけで使われ、送信されません。<br>🔊 音が出ます（iPhoneはマナーモードを解除）</p>
</div>

<div id="hud"></div>
<div id="toast"></div>
<div id="bar" hidden>
  <button id="save">💾 保存</button>
  <button id="clear">🧹 消す</button>
  <button id="info">📊 センサー</button>
  <button id="snd">🔊 音</button>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const ecv = document.getElementById('e'), ectx = ecv.getContext('2d');
  let W, H, DPR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ecv.width = W * DPR; ecv.height = H * DPR; ectx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);
  }
  addEventListener('resize', resize); resize();

  // ---- センサー状態 ----
  const S = { gx: 0, gy: 0.15, beta: null, gamma: null, acc: 0, lat: null, lon: null, battery: null, touches: [] };
  let baseHue = (new Date().getHours() / 24) * 360; // 時刻で最初の色
  let paletteShift = 0;
  const palettes = [[0, 40, 80], [180, 220, 260], [300, 330, 20], [90, 140, 190], [0, 120, 240]];
  let pIdx = 0;

  function onOrient(e) {
    if (e.beta == null) return;
    S.beta = e.beta; S.gamma = e.gamma;
    // 画面の向きを考慮して重力方向に変換
    const ang = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
    let x = e.gamma / 45, y = e.beta / 45;
    if (ang === 90) [x, y] = [y, -x]; else if (ang === -90 || ang === 270) [x, y] = [-y, x];
    S.gx = Math.max(-1, Math.min(1, x)) * 0.35;
    S.gy = Math.max(-1, Math.min(1, y)) * 0.35;
  }
  let lastShake = 0;
  function onMotion(e) {
    const a = e.acceleration && e.acceleration.x != null ? e.acceleration : null;
    if (!a) return;
    S.acc = Math.hypot(a.x, a.y, a.z);
    const now = performance.now();
    if (S.acc > 18 && now - lastShake > 1200) { lastShake = now; shake(); }
  }
  function shake() {
    pIdx = (pIdx + 1) % palettes.length;
    paletteShift = Math.random() * 360;
    if (navigator.vibrate) navigator.vibrate([40, 40, 80]);
    toast('新しい世界');
    for (let i = 0; i < 300; i++) spawn(W / 2, H / 2, 8);
    for (let i = 0; i < 40; i++) spawnEmoji(W / 2, H / 2, 9);
    shakeChord();
  }

  async function start() {
    try { initAudio(); AC.resume(); } catch (_) {}
    // iOS はユーザー操作中に許可が必要
    try {
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function')
        await DeviceOrientationEvent.requestPermission();
      if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission === 'function')
        await DeviceMotionEvent.requestPermission();
    } catch (_) {}
    addEventListener('deviceorientation', onOrient);
    addEventListener('devicemotion', onMotion);
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => {
      S.lat = p.coords.latitude; S.lon = p.coords.longitude;
      baseHue = (baseHue + Math.abs(S.lat * 7 + S.lon * 3)) % 360; // 場所で色をずらす
      toast('📍 この場所の色');
    }, () => {}, { timeout: 8000 });
    if (navigator.getBattery) navigator.getBattery().then(b => {
      const upd = () => S.battery = b.level; upd(); b.addEventListener('levelchange', upd);
    });
    document.getElementById('intro').classList.add('hide');
    document.getElementById('bar').hidden = false;
    if (navigator.vibrate) navigator.vibrate(30);
  }
  document.getElementById('start').onclick = start;

  // ---- タッチ / マウス ----
  const ptrs = new Map();
  cv.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY, d: 0 });
    for (let i = 0; i < 6; i++) spawnEmoji(e.clientX, e.clientY, 4);
    touchNote(e.clientY);
  });
  cv.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (p) { p.px = p.x; p.py = p.y; p.x = e.clientX; p.y = e.clientY; }
    else if (e.pointerType === 'mouse' && S.beta == null) { // PC: マウス位置で重力
      S.gx = (e.clientX / W - .5) * .5; S.gy = (e.clientY / H - .5) * .5;
    }
  });
  const up = e => ptrs.delete(e.pointerId);
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  addEventListener('keydown', e => { if (e.key === ' ') shake(); });


  // ================= 音（Web Audio で合成：バッハ BWV846 前奏曲） =================
  const N = n => { const m = n.match(/^([A-G])([#b]?)(\d)$/); const b = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2]==='#'?1:m[2]==='b'?-1:0); return 440 * Math.pow(2, (b + (+m[3]+1)*12 - 69) / 12); };
  const BARS = `C4 E4 G4 C5 E5|C4 D4 A4 D5 F5|B3 D4 G4 D5 F5|C4 E4 G4 C5 E5|C4 E4 A4 E5 A5|C4 D4 F#4 A4 D5|B3 D4 G4 D5 G5|B3 C4 E4 G4 C5|A3 C4 E4 G4 C5|D3 A3 D4 F#4 C5|G3 B3 D4 G4 B4|G3 Bb3 E4 G4 C#5|F3 A3 D4 A4 D5|F3 Ab3 D4 F4 B4|E3 G3 C4 G4 C5|E3 F3 A3 C4 F4|D3 F3 A3 C4 F4|G2 D3 G3 B3 F4|C3 E3 G3 C4 E4|C3 G3 Bb3 C4 E4|F2 F3 A3 C4 E4|F#2 C3 A3 C4 Eb4|Ab2 F3 B3 C4 D4|G2 F3 G3 B3 D4|G2 E3 G3 C4 E4|G2 D3 G3 C4 F4|G2 D3 G3 B3 F4|G2 Eb3 A3 C4 F#4|G2 E3 G3 C4 G4|G2 D3 G3 C4 F4|G2 D3 G3 B3 F4|C2 C3 G3 Bb3 E4`
    .split('|').map(b => b.split(' ').map(N));
  const ORDER = [0,1,2,3,4,2,3,4, 0,1,2,3,4,2,3,4];
  let AC = null, master, rev, pan, soundOn = true, bar = 0, step = 0, nextT = 0;
  const STEP = 0.16;
  function initAudio() {
    if (AC) return;
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .55;
    pan = AC.createStereoPanner ? AC.createStereoPanner() : AC.createGain();
    // 簡易リバーブ（ホールっぽい響き）
    rev = AC.createConvolver();
    const len = AC.sampleRate * 2.8, ir = AC.createBuffer(2, len, AC.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3); }
    rev.buffer = ir;
    const wet = AC.createGain(); wet.gain.value = .35;
    master.connect(pan); pan.connect(AC.destination); master.connect(rev); rev.connect(wet); wet.connect(AC.destination);
    nextT = AC.currentTime + .3;
    setInterval(schedule, 50);
  }
  // ピアノ風の音
  function note(freq, t, vel = .2, dur = 2.2) {
    const o1 = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
    o1.type = 'triangle'; o2.type = 'sine'; o1.frequency.value = freq; o2.frequency.value = freq * 2;
    const g2 = AC.createGain(); g2.gain.value = .25;
    f.type = 'lowpass'; f.frequency.setValueAtTime(Math.min(9000, freq * 8), t); f.frequency.exponentialRampToValueAtTime(Math.max(300, freq * 1.5), t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + .008); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o1.connect(f); o2.connect(g2); g2.connect(f); f.connect(g); g.connect(master);
    o1.start(t); o2.start(t); o1.stop(t + dur + .05); o2.stop(t + dur + .05);
  }
  function schedule() {
    if (!soundOn || AC.state !== 'running') { nextT = AC.currentTime + .1; return; }
    while (nextT < AC.currentTime + .25) {
      const notes = BARS[bar], idx = ORDER[step], f = notes[idx];
      note(f, nextT, step % 8 === 0 ? .22 : .15, idx < 2 ? 3.2 : 1.8);
      // 音に合わせて光る（高い音ほど上）
      const delay = Math.max(0, (nextT - AC.currentTime) * 1000);
      const y = H * (1 - (Math.log2(f / 65) / 5.5)), x = W * (.15 + .7 * (step / 15));
      setTimeout(() => { for (let i = 0; i < 4; i++) spawn(x, y, 1.2); }, delay);
      nextT += STEP;
      if (++step === 16) { step = 0; bar = (bar + 1) % BARS.length; if (bar === 0) nextT += STEP * 4; }
    }
  }
  // 指で触ると今の和音から音が鳴る（上ほど高い）
  let lastTouchNote = 0;
  function touchNote(y) {
    if (!AC || !soundOn) return;
    const now = AC.currentTime;
    if (now - lastTouchNote < .09) return;
    lastTouchNote = now;
    const chord = BARS[bar].slice(1), k = Math.max(0, Math.min(chord.length*2 - 1, Math.floor((1 - y / H) * chord.length * 2)));
    note(chord[k % chord.length] * (k >= chord.length ? 2 : 1), now, .13, 1.6);
  }
  function shakeChord() {
    if (!AC || !soundOn) return;
    const t = AC.currentTime;
    BARS[bar].forEach((f, i) => { note(f, t + i * .04, .14, 3); note(f * 2, t + .2 + i * .04, .08, 3); });
  }
  const sndBtn = document.getElementById('snd');
  sndBtn.onclick = () => {
    soundOn = !soundOn; sndBtn.textContent = soundOn ? '🔊 音' : '🔇 音';
    if (AC) master.gain.setTargetAtTime(soundOn ? .55 : 0, AC.currentTime, .05);
  };

  // ================= 絵文字 =================
  const EMOJI = [['✨','🌟','💫','⭐','🌙','🪐'], ['🫧','🐬','💎','🧊','🌊','🦋'], ['🌸','🌺','💖','🎀','🌷','🍓'], ['🍀','🌿','🐸','🌱','🍃','🦖'], ['🚀','🛸','👾','🌈','🎉','🔥']];
  const E = [], EMAX = 160, ecache = new Map();
  function emojiImg(ch) {
    if (ecache.has(ch)) return ecache.get(ch);
    const c = document.createElement('canvas'); c.width = c.height = 96;
    const x = c.getContext('2d'); x.font = '72px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, 48, 54);
    ecache.set(ch, c); return c;
  }
  function spawnEmoji(x, y, sp = 3, vx0 = 0, vy0 = 0) {
    if (E.length >= EMAX) E.shift();
    const set = EMOJI[pIdx], a = Math.random() * Math.PI * 2, s = 1 + Math.random() * sp;
    E.push({ x, y, vx: Math.cos(a) * s + vx0, vy: Math.sin(a) * s + vy0 - 1.5, rot: Math.random() * 6, vr: (Math.random() - .5) * .15,
      size: 22 + Math.random() * 30, life: 1, img: emojiImg(set[(Math.random() * set.length) | 0]) });
  }
  function drawEmoji() {
    ectx.clearRect(0, 0, W, H);
    for (let i = E.length - 1; i >= 0; i--) {
      const e = E[i];
      e.vx += S.gx * .6; e.vy += S.gy * .6 - .02; e.vx *= .985; e.vy *= .985;
      e.x += e.vx; e.y += e.vy; e.rot += e.vr; e.life -= .006;
      if (e.x < 0 || e.x > W) { e.vx *= -.8; e.x = Math.max(0, Math.min(W, e.x)); }
      if (e.y < 0 || e.y > H) { e.vy *= -.8; e.y = Math.max(0, Math.min(H, e.y)); }
      if (e.life <= 0) { E.splice(i, 1); continue; }
      const sc = e.size * (e.life < .2 ? e.life / .2 : Math.min(1, (1 - e.life) * 8 + .3));
      ectx.save(); ectx.globalAlpha = Math.min(1, e.life * 1.5); ectx.translate(e.x, e.y); ectx.rotate(e.rot);
      ectx.drawImage(e.img, -sc / 2, -sc / 2, sc, sc); ectx.restore();
    }
    ectx.globalAlpha = 1;
  }

  // ---- パーティクル ----
  const P = [], MAX = 2500;
  function spawn(x, y, sp = 2, vx0 = 0, vy0 = 0) {
    if (P.length >= MAX) P.shift();
    const a = Math.random() * Math.PI * 2, s = Math.random() * sp;
    const pal = palettes[pIdx];
    const hue = (baseHue + paletteShift + pal[(Math.random() * 3) | 0] + Math.random() * 20) % 360;
    P.push({ x, y, vx: Math.cos(a) * s + vx0, vy: Math.sin(a) * s + vy0, life: 1, hue, r: 1 + Math.random() * 2.2 });
  }

  // ---- メインループ ----
  let t = 0;
  function frame() {
    t++;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5,6,10,0.06)'; ctx.fillRect(0, 0, W, H);

    // 指先から湧き出す
    for (const p of ptrs.values()) {
      const vx = (p.x - p.px) * .3, vy = (p.y - p.py) * .3;
      for (let i = 0; i < 6; i++) spawn(p.x, p.y, 2.5, vx, vy);
      p.d += Math.hypot(p.x - p.px, p.y - p.py);
      if (t % 5 === 0) spawnEmoji(p.x, p.y, 2, vx * .5, vy * .5);
      if (p.d > 40) { p.d = 0; touchNote(p.y); }
      p.px = p.x; p.py = p.y;
    }
    // 何もしなくても少しずつ生まれる
    if (t % 3 === 0) spawn(Math.random() * W, Math.random() * H, .5);

    ctx.globalCompositeOperation = 'lighter';
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      // 流れ場 + 重力（傾き）
      const n = Math.sin(p.x * .006 + t * .01) + Math.cos(p.y * .006 - t * .008);
      p.vx += S.gx + Math.cos(n * Math.PI) * .04;
      p.vy += S.gy + Math.sin(n * Math.PI) * .04;
      p.vx *= .97; p.vy *= .97;
      const ox = p.x, oy = p.y;
      p.x += p.vx; p.y += p.vy;
      // 壁で跳ね返る
      if (p.x < 0 || p.x > W) { p.vx *= -.7; p.x = Math.max(0, Math.min(W, p.x)); }
      if (p.y < 0 || p.y > H) { p.vy *= -.7; p.y = Math.max(0, Math.min(H, p.y)); }
      p.life -= .0035;
      if (p.life <= 0) { P.splice(i, 1); continue; }
      ctx.strokeStyle = `hsla(${p.hue},90%,62%,${p.life * .8})`;
      ctx.lineWidth = p.r;
      ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    drawEmoji();
    if (pan && pan.pan) pan.pan.value = Math.max(-1, Math.min(1, S.gx * 2));
    if (hud.classList.contains('show') && t % 6 === 0) drawHud();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- UI ----
  const hud = document.getElementById('hud');
  const f = (v, d = 1) => v == null ? '—' : v.toFixed(d);
  function drawHud() {
    hud.innerHTML =
      `傾き 前後 ${f(S.beta)}° / 左右 ${f(S.gamma)}°<br>` +
      `揺れ ${f(S.acc)} m/s² ・ 光の粒 ${P.length}<br>` +
      `位置 ${S.lat == null ? '—' : f(S.lat, 3) + ', ' + f(S.lon, 3)} ・ ` +
      `電池 ${S.battery == null ? '—' : Math.round(S.battery * 100) + '%'} ・ 色相 ${Math.round(baseHue)}°`;
  }
  document.getElementById('info').onclick = () => { hud.classList.toggle('show'); drawHud(); };
  document.getElementById('clear').onclick = () => { P.length = 0; E.length = 0; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H); };
  document.getElementById('save').onclick = () => {
    const out = document.createElement('canvas'); out.width = cv.width; out.height = cv.height;
    const o = out.getContext('2d'); o.drawImage(cv, 0, 0); o.drawImage(ecv, 0, 0);
    out.toBlob(async blob => {
      const name = `shinjidai-${Date.now()}.png`;
      const file = new File([blob], name, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: '新時代' }); return; } catch (_) { return; }
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
  };
  const toastEl = document.getElementById('toast');
  let tt;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('on'), 1400); }
})();
</script>
</body>
</html>
