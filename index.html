<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sameshark2 のページ</title>
<style>
  :root { --bg:#f6f4fb; --card:#fff; --fg:#2d2640; --dim:#6f6787; --line:#e6e1f2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16131f; --card:#221d30; --fg:#f1eefa; --dim:#a59dbd; --line:#342c47; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:40px 16px 48px; }
  h1 { font-size:24px; margin:0 0 6px; }
  .lead { color:var(--dim); margin:0 0 28px; font-size:14px; }
  a.card { display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line); border-radius:20px;
    padding:18px; margin:0 0 14px; color:inherit; text-decoration:none; transition:transform .15s, box-shadow .15s; }
  a.card:hover, a.card:active { transform:translateY(-2px); box-shadow:0 8px 24px rgba(60,40,120,.12); }
  .icon { width:64px; height:64px; flex:none; border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:34px; }
  .icon img { width:100%; height:100%; border-radius:16px; }
  .t { font-size:18px; font-weight:700; margin:0 0 4px; }
  .d { font-size:13px; color:var(--dim); margin:0; line-height:1.6; }
  .go { margin-left:auto; color:var(--dim); font-size:22px; }
</style>
</head>
<body>
<main>
  <h1>sameshark2 のページ</h1>
  <p class="lead">遊びたいもの・見たいものを選んでね</p>

  <a class="card" href="shiho/">
    <div class="icon"><img src="shiho/icon-192.png" alt=""></div>
    <div><p class="t">しほんぬタッピング！</p><p class="d">詩歩ちゃん専用。泡をタッチして30秒で何個割れるかなゲーム</p></div>
    <span class="go">›</span>
  </a>

  <a class="card" href="shinjidai/">
    <div class="icon" style="background:linear-gradient(135deg,#5b8cff,#b45bff,#ff6fa8)">✨</div>
    <div><p class="t">新時代</p><p class="d">スマホを傾けて・触って・振って、光と絵文字とバッハで絵を描く</p></div>
    <span class="go">›</span>
  </a>

  <a class="card" href="progate/">
    <div class="icon" style="background:#239b76;color:#fff">📘</div>
    <div><p class="t">Progate 練習サイト</p><p class="d">Progate の HTML &amp; CSS レッスンで作った練習ページ</p></div>
    <span class="go">›</span>
  </a>
</main>
</body>
</html>
